name: Website quality
on:
  push:
    branches: [main, codex/proworks-rebrand, codex/proworks-visual-fidelity-v2]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CROSS_BROWSER: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run verify
      - run: |
          node scripts/serve.mjs &
          node scripts/visual-fidelity.mjs after
          node scripts/build-visual-review.mjs
      - run: npx tsc -p worker/tsconfig.json
      - run: npx wrangler deploy --dry-run --outdir artifacts/worker-dry-run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proworks-browser-evidence
          path: |
            playwright-report/
            test-results/
            artifacts/screenshots/
            artifacts/qa/
            artifacts/visual-fidelity-v2/
          retention-days: 7
