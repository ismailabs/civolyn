name: Website quality
on:
  push:
    branches: [main, codex/proworks-rebrand]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
      - run: npx tsc -p worker/tsconfig.json
      - run: npx wrangler deploy --dry-run --outdir artifacts/worker-dry-run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proworks-browser-evidence
          path: |
            playwright-report/
            test-results/
            artifacts/screenshots/
            artifacts/qa/
          retention-days: 7
